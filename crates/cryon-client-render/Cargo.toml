[package]
name = "cryon-client-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "The client's world data, rendering and screens: chunks, meshing, light, streaming, the renderer, the HUD, menus and settings; no gameplay"

[dependencies]
cryon-assets = { path = "../cryon-assets" }
cryon-bench = { path = "../cryon-bench" }
cryon-client-core = { path = "../cryon-client-core" }
cryon-client-input = { path = "../cryon-client-input" }
cryon-command = { path = "../cryon-command" }
cryon-core = { path = "../cryon-core" }
cryon-hdr = { path = "../cryon-hdr" }
cryon-items = { path = "../cryon-items" }
# The narrator option's status and whether the narrator is there (Options.narrator).
cryon-narrator = { path = "../cryon-narrator" }
cryon-protocol = { path = "../cryon-protocol" }
cryon-shader-api = { path = "../cryon-shader-api" }
cryon-shaders = { path = "../cryon-shaders" }
cryon-telemetry = { path = "../cryon-telemetry", default-features = false, features = ["live"] }
cryon-theme = { path = "../cryon-theme" }
cryon-threads = { path = "../cryon-threads" }
cryon-world = { path = "../cryon-world" }
ab_glyph = "0.2.32"
base64 = "0.22"
bytemuck = { version = "1.24", features = ["derive"] }
# Sound (ALSA on Linux); the `audio` feature.
cpal = { version = "0.16", optional = true }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
glam = "0.30"
log = "0.4"
miniz_oxide = "0.8"
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-in", "hlsl-out"] }
half = "2"
png = "0.18"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha1 = "0.10"
sha2 = "0.10.9"
smallvec = { version = "1", features = ["const_new"] }
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis"] }
unicode-bidi = "0.3.18"
ureq = { version = "2", default-features = false, features = ["tls"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "wgsl", "naga-ir"] }
winit = "0.30.13"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["dx12"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["gles"] }

[features]
# Sound output: cryon-client's `audio` feature.
audio = ["dep:cpal"]
# Helpers cryon-client's tests build their fixtures with.
test-support = []

[lints]
workspace = true

[dev-dependencies]
cryon-items = { path = "../cryon-items", features = ["test-support"] }
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out", "msl-out", "spv-out"] }
